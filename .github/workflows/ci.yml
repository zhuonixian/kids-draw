name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 语法检查
        run: |
          for f in js/*.js server.js sw.js; do node --check "$f"; done
      - name: 行为测试
        run: node tests/behavior.test.js
